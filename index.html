<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Trip USA 2026 — Itinéraire Interactif</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --card2: #1a1a1a;
    --border: #2a2a2a;
    --border-light: #333;
    --text: #e8e8e8;
    --muted: #888;
    --accent: #00d4aa;
    --accent-dim: rgba(0,212,170,.15);
    --green: #4ade80;
    --orange: #fb923c;
    --red: #ef4444;
    --pink: #f472b6;
    --blue: #38bdf8;
    --gold: #fbbf24;
    --radius: 12px;
    --radius-sm: 8px;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* HEADER */
  .hero {
    position: relative;
    padding: 60px 24px 40px;
    background: linear-gradient(135deg, #0d1f1c 0%, #0a0a0a 50%, #1a0d1a 100%);
    text-align: center;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 40%, rgba(0,212,170,.06) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(248,186,42,.04) 0%, transparent 50%);
    pointer-events: none;
  }
  .hero h1 {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: -.03em;
    position: relative;
  }
  .hero h1 span { color: var(--accent); }
  .hero .sub {
    color: var(--muted);
    margin-top: 8px;
    font-size: 1rem;
    position: relative;
  }
  .hero .badge-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
    position: relative;
  }
  .hero .badge-row .view-toggle {
    display: inline-flex; align-items: center; gap: 0;
    background: var(--card2); border: 1px solid var(--border-light);
    border-radius: 99px; overflow: hidden; margin: 0 4px;
  }
  .hero .badge-row .view-toggle button {
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 6px 16px; font-size: .8rem; font-weight: 600;
    transition: all .2s; white-space: nowrap;
  }
  .hero .badge-row .view-toggle button.active {
    background: var(--accent); color: #0a0a0a;
  }
  .hero .badge-row .view-toggle button:first-child { border-radius: 99px 0 0 99px; }
  .hero .badge-row .view-toggle button:last-child { border-radius: 0 99px 99px 0; }
  .hero .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--accent-dim);
    color: var(--accent);
    padding: 5px 14px;
    border-radius: 99px;
    font-size: .8rem;
    font-weight: 600;
    border: 1px solid rgba(0,212,170,.2);
  }
  .hero .badge.gold { background: rgba(251,191,36,.12); color: var(--gold); border-color: rgba(251,191,36,.2); }
  .hero .badge.red { background: rgba(239,68,68,.12); color: var(--red); border-color: rgba(239,68,68,.2); }

  /* PROGRESS BAR */
  .progress-wrap {
    max-width: 1000px;
    margin: -24px auto 0;
    padding: 0 20px;
    position: relative;
    z-index: 2;
  }
  .progress-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    backdrop-filter: blur(20px);
  }
  .progress-bar .label {
    font-size: .85rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .progress-bar .label span { color: var(--accent); }
  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 99px;
    transition: width .5s ease;
  }
  .progress-bar .pct {
    font-size: .85rem;
    color: var(--muted);
    font-weight: 600;
    min-width: 40px;
    text-align: right;
  }

  /* CONTROLS */
  .controls {
    max-width: 1000px;
    margin: 16px auto 0;
    padding: 0 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .controls button {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--card);
    color: var(--text);
    font-size: .82rem;
    cursor: pointer;
    transition: all .15s;
    font-weight: 500;
  }
  .controls button:hover { background: var(--card2); border-color: var(--accent); }
  .controls button.danger:hover { border-color: var(--red); color: var(--red); }
  .controls .controls-toggle { display:inline-flex; gap:0; margin-left:auto; flex-shrink:0; }
  .controls .ctrl-btn {
    background:var(--card2); border:1px solid var(--border-light); color:var(--muted);
    cursor:pointer; padding:6px 12px; font-size:.78rem; font-weight:600; transition:all .2s;
  }
  .controls .ctrl-btn:first-child { border-radius:8px 0 0 8px; }
  .controls .ctrl-btn:last-child { border-radius:0 8px 8px 0; }
  .controls .ctrl-btn.active { background:var(--accent); color:#0a0a0a; border-color:var(--accent); }

  /* DAYS */
  .container {
    max-width: 1000px;
    margin: 20px auto 60px;
    padding: 0 20px;
  }

  .day-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color .2s;
  }
  .day-card.completed {
    border-color: rgba(74,222,128,.15);
    opacity: .85;
  }
  .day-card.completed .day-header .day-title { color: var(--muted); }
  .day-card.completed .day-header .check-circle { background: var(--green); border-color: var(--green); }
  .day-card.completed .day-header .check-circle::after { content: '✓'; color: #0a0a0a; font-weight: 700; font-size: .7rem; }

  .day-header {
    display: flex;
    align-items: stretch;
    cursor: pointer;
    user-select: none;
    transition: background .15s;
    position: relative;
  }
  .day-header:hover { background: rgba(255,255,255,.02); }

  /* EDIT MODE */
  .day-card .edit-btn {
    background:none; border:none; color:var(--muted); font-size:.8rem; cursor:pointer;
    padding:2px 5px; border-radius:4px; line-height:1; transition:all .2s;
    display:flex; align-items:center; gap:2px; flex-shrink:0;
  }
  .day-card .edit-btn:hover { background:var(--accent-dim); color:var(--accent); }
  .day-card.editing .edit-btn { color:var(--accent); background:var(--accent-dim); }
  .day-card .add-btn {
    display:none; background:var(--accent-dim); border:1px solid rgba(0,212,170,.3);
    color:var(--accent); cursor:pointer; border-radius:50%; width:26px; height:26px;
    font-size:1rem; line-height:1; vertical-align:middle; margin-left:8px; transition:all .2s;
  }
  .day-card .add-btn:hover { background:rgba(0,212,170,.3); }
  .day-card.editing .add-btn { display:inline-flex; align-items:center; justify-content:center; }
  .day-card .del-act-btn {
    display:none; background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.3);
    color:var(--red); cursor:pointer; border-radius:50%; width:22px; height:22px;
    font-size:.7rem; line-height:1; margin-left:auto; flex-shrink:0; transition:all .2s;
    align-items:center; justify-content:center;
  }
  .day-card .del-act-btn:hover { background:rgba(239,68,68,.3); }
  .day-card.editing .del-act-btn { display:inline-flex; }
  .day-card .edit-inline {
    background:rgba(0,0,0,.4); border:1px solid var(--border-light); border-radius:4px;
    color:var(--text); font:inherit; font-size:inherit; padding:2px 6px; width:auto;
    outline:none; min-width:60px; max-width:100%;
  }
  .day-card .edit-inline:focus { border-color:var(--accent); }
  .day-card.editing .activity-item:hover { background:rgba(255,255,255,.03); }

  .day-check {
    display: flex;
    align-items: center;
    padding: 0 12px 0 18px;
    flex-shrink: 0;
  }
  .check-circle {
    width: 24px;
    height: 24px;
    border: 2px solid var(--border-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .2s;
    font-size: .7rem;
  }
  .check-circle:hover { border-color: var(--accent); }

  .day-meta {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 14px 12px;
    min-width: 60px;
    flex-shrink: 0;
  }
  .day-meta .num {
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.1;
  }
  .day-meta .date {
    font-size: .7rem;
    color: var(--muted);
    font-weight: 500;
  }

  .day-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 14px 12px;
    min-width: 0;
  }
  .day-info .day-title {
    font-size: .95rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .day-info .day-sub {
    font-size: .78rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .day-stats {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    flex-shrink: 0;
  }
  .day-stats .stat {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: .75rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .day-stats .stat svg { width: 14px; height: 14px; flex-shrink: 0; }

  .day-arrow {
    display: flex;
    align-items: center;
    padding: 0 16px 0 8px;
    color: var(--muted);
    flex-shrink: 0;
    transition: transform .2s;
  }
  .day-card.collapsed .day-arrow { transform: rotate(-90deg); }

  .day-body {
    border-top: 1px solid var(--border);
    padding: 0;
    overflow: hidden;
    max-height: 2000px;
    transition: max-height .35s ease, padding .25s ease;
  }
  .day-card.collapsed .day-body {
    max-height: 0 !important;
    padding: 0 !important;
    border-top-color: transparent;
  }

  .day-body-inner {
    padding: 20px 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .info-block {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
  }
  .info-block.full { grid-column: 1 / -1; }
  .info-block h3 {
    font-size: .75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .info-block h3.warn { color: var(--orange); }
  .info-block h3.alert { color: var(--red); }
  .info-block p, .info-block li {
    font-size: .88rem;
    line-height: 1.5;
    color: var(--text);
  }
  .info-block ul {
    list-style: none;
    padding: 0;
  }
  .info-block ul li {
    padding: 2px 0;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .info-block ul li::before {
    content: '•';
    color: var(--accent);
    font-weight: 700;
  }
  .info-block .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: .75rem;
    font-weight: 600;
  }
  .tag.green { background: rgba(74,222,128,.12); color: var(--green); }
  .tag.orange { background: rgba(251,146,60,.12); color: var(--orange); }
  .tag.red { background: rgba(239,68,68,.12); color: var(--red); }
  .tag.accent { background: var(--accent-dim); color: var(--accent); }
  .tag.blue { background: rgba(56,189,248,.12); color: var(--blue); }

  .activity-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .activity-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 8px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: .85rem;
    line-height: 1.4;
  }
  .activity-item .time {
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
    min-width: 48px;
    font-size: .8rem;
  }
  .activity-item .check-activity {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border-light);
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 1px;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .6rem;
  }
  .activity-item .check-activity:hover { border-color: var(--accent); }
  .activity-item.done { opacity: .7; }
  .activity-item.done .check-activity { background: var(--green); border-color: var(--green); }
  .activity-item.done .check-activity::after { content: '✓'; color: #0a0a0a; font-weight: 700; }
  .activity-item.done .act-text { text-decoration: line-through; color: var(--muted); }
  .activity-item .act-text { flex: 1; }

  /* HIGHLIGHT DAYS */
  .day-card.highlight {
    border-color: var(--accent);
    box-shadow: 0 0 24px rgba(0,212,170,.06);
  }
  .day-card.highlight.vegas {
    border-color: var(--pink);
    box-shadow: 0 0 24px rgba(244,114,182,.06);
  }
  .day-card.highlight.ucla {
    border-color: var(--blue);
    box-shadow: 0 0 24px rgba(56,189,248,.06);
  }
  .day-card.highlight.wedding {
    border-color: var(--gold);
    box-shadow: 0 0 24px rgba(251,191,36,.08);
    background: linear-gradient(135deg, var(--card) 0%, #1a1410 100%);
  }

  /* RESPONSIVE */
  @media (max-width: 700px) {
    .hero h1 { font-size: 1.6rem; }
    .day-body-inner { grid-template-columns: 1fr; gap: 10px; padding: 14px 16px; }
    .day-stats { gap: 6px; padding: 0 8px; }
    .day-stats .stat { font-size: .65rem; }
    .day-stats .stat svg { width: 11px; height: 11px; }
    .day-meta { min-width: 40px; padding: 10px 6px; }
    .day-meta .num { font-size: 1rem; }
    .day-info { padding: 10px 6px; }
    .day-info .day-title { font-size: .85rem; }
    .day-check { padding: 0 4px 0 8px; }
    .check-circle { width: 20px; height: 20px; }
    .day-arrow { padding: 0 8px; }
    .day-card .edit-btn { font-size: .7rem; padding: 2px 4px; }
    .progress-bar { flex-wrap: wrap; padding: 12px 16px; }
    .controls { padding: 0 12px; }
    .container { padding: 0 10px; }
  }

  /* TOOLTIP */
  .legend {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: .78rem;
    color: var(--muted);
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .legend .view-toggle { gap: 0; margin-left: auto; }
  .legend .toggle-btn {
    background: var(--card2); border: 1px solid var(--border-light); color: var(--muted);
    cursor: pointer; padding: 4px 12px; font-size: .75rem; font-weight: 600; transition: all .2s;
  }
  .legend .toggle-btn:first-child { border-radius: 99px 0 0 99px; }
  .legend .toggle-btn:last-child { border-radius: 0 99px 99px 0; }
  .legend .toggle-btn.active { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }
</style>
</head>
<body>

<div class="hero">
  <h1>🇺🇸 Road Trip <span>USA</span> 2026</h1>
  <p class="sub">31 juillet → 24 août · 25 jours · ~4 500 km · 14 voyageurs</p>
  <div class="badge-row">
    <span class="badge">💒 Vegas 08/08</span>
    <span class="badge gold">🎓 UCLA 17-21/08</span>
    <span class="badge red">⚠️ Death Valley 09/08</span>
    <span class="badge">✈️ United Airlines</span>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-bar">
    <span class="label">📊 <span id="done-count">0</span>/25 jours</span>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="pct" id="pct-text">0%</span>
  </div>
</div>

<div class="controls">
  <button onclick="expandAll()">📂 Tout ouvrir</button>
  <button onclick="collapseAll()">📁 Tout fermer</button>
  <button onclick="checkAll()">✅ Tout marquer fait</button>
  <button onclick="uncheckAll()" class="danger">⬜ Tout remettre à zéro</button>
  <button onclick="resetAll()" style="border-color:var(--red);color:var(--red)">🔄 Réinitialiser</button>
  <span class="controls-toggle">
    <button id="view-family" onclick="setView('family')" class="ctrl-btn">👨‍👩‍👧‍👧</button>
    <button id="view-ronald" onclick="setView('ronald')" class="ctrl-btn active">🎓</button>
  </span>
</div>

<div class="legend" style="margin-top:12px">
  <span class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span> Jour standard</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--pink)"></span> Las Vegas</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--gold)"></span> 💒 Mariage</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--blue)"></span> UCLA EMBA</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--red)"></span> ⚠️ Vigilance</span>
</div>

<div class="container" id="app"></div>

    const view = localStorage.getItem('roadtrip-view') || 'ronald';
    const isFamily = view === 'family' && d.family;
    const dispTitle = isFamily ? d.family.title : d.title;
    const dispHighlights = isFamily ? (d.family.highlights || d.highlights) : d.highlights;
    const dispAlert = isFamily ? null : d.alert;
    const dispActivities = isFamily ? d.family.activities : d.activities;
    const tags = [];
    if (dispAlert) tags.push('<span class="tag red">⚠️</span>');
    if (d.class==='wedding') tags.push(`<span class="tag gold">💒</span>`);
    if (d.class==='vegas') tags.push(`<span class="tag" style="background:rgba(244,114,182,.12);color:var(--pink)">💎</span>`);
    if (d.class==='ucla') tags.push(`<span class="tag blue">🎓</span>`);
    if (d.class==='danger') tags.push(`<span class="tag red">🥵</span>`);
    if (d.hotel !== '—') tags.push(`<span class="tag" style="background:rgba(255,255,255,.05);color:var(--muted)">🏨</span>`);

    const card = document.createElement('div');
    card.className = `day-card ${d.class||''} collapsed`;
    card.dataset.index = i;

    card.innerHTML = `
      <div class="day-header" onclick="toggleDay(this.parentElement)">
        <div class="day-check" onclick="event.stopPropagation()">
          <div class="check-circle" onclick="toggleDayCheck(this)"></div>
        </div>
        <div class="day-meta">
          <span class="num">${d.day}</span>
          <span class="date">${d.date} ${d.dow}</span>
        </div>
        <div class="day-info">
          <span class="day-title">${d.emoji} ${dispTitle}</span>
          <span class="day-sub">${d.hotel}</span>
        </div>
        <div class="day-stats">
          <button class="edit-btn" onclick="event.stopPropagation();toggleEditMode(this)" title="Modifier">✏️</button>
          <span class="stat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            ${d.drive}
          </span>
          <span class="stat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            ${d.km}km
          </span>
          ${tags.join(' ')}
        </div>
        <div class="day-arrow">▼</div>
      </div>
      <div class="day-body">
        <div class="day-body-inner">
          <div class="info-block full">
            <h3>🏨 Hébergement</h3>
            <p>${d.hotel}</p>
          </div>
          ${dispAlert ? `<div class="info-block full"><h3 class="alert">⚠️ Alerte</h3><p>${dispAlert}</p></div>` : ''}
          ${dispHighlights ? `<div class="info-block"><h3>⭐ Points forts</h3><ul>${dispHighlights.map(h => `<li>${h}</li>`).join('')}</ul></div>` : ''}
          <div class="info-block" style="grid-column:1/-1">
            <h3>📋 Activités <button class="add-btn" onclick="addActivity(this)" title="Ajouter activité">＋</button></h3>
            <div class="activity-list">
              ${getActivitiesForDay(i, dispActivities).map((a, ai) => `
                <div class="activity-item" data-ai="${ai}" onclick="toggleActivity(this)">
                  <div class="check-activity"></div>
                  <span class="time" onclick="event.stopPropagation();startEdit(this,'time',${i},${ai})">${a.time}</span>
                  <span class="act-text" onclick="event.stopPropagation();startEdit(this,'text',${i},${ai})">${a.text}</span>
                  <button class="del-act-btn" onclick="event.stopPropagation();deleteActivity(this,${i},${ai})" title="Supprimer">✕</button>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      </div>
    `;
    app.appendChild(card);
  });
  updateProgress();
  restoreState();
}

// ========== INTERACTIONS ==========
function toggleDay(el) { el.classList.toggle('collapsed'); }
function expandAll() { document.querySelectorAll('.day-card').forEach(d => d.classList.remove('collapsed')); }
function collapseAll() { document.querySelectorAll('.day-card').forEach(d => d.classList.add('collapsed')); }

function toggleDayCheck(el) {
  const card = el.closest('.day-card');
  card.classList.toggle('completed');
  saveState();
  updateProgress();
}

function toggleActivity(el) {
  el.classList.toggle('done');
  // Check if all activities in this day are done
  const card = el.closest('.day-card');
  const all = card.querySelectorAll('.activity-item');
  const done = card.querySelectorAll('.activity-item.done');
  if (all.length === done.length && all.length > 0) {
    card.querySelector('.check-circle').classList.add('auto');
    // Don't auto-complete the day, but hint
  }
  saveActivities();
  updateProgress();
}

function checkAll() {
  document.querySelectorAll('.day-card').forEach(card => {
    card.classList.add('completed');
    card.querySelectorAll('.activity-item').forEach(a => a.classList.add('done'));
  });
  saveState();
  saveActivities();
  updateProgress();
}

function uncheckAll() {
  document.querySelectorAll('.day-card').forEach(card => {
    card.classList.remove('completed');
  });
  document.querySelectorAll('.activity-item').forEach(a => a.classList.remove('done'));
  saveState();
  saveActivities();
  updateProgress();
}

function resetAll() {
  if (!confirm('Réinitialiser tout l\'itinéraire ?')) return;
  localStorage.removeItem('roadtrip-days');
  localStorage.removeItem('roadtrip-activities');
  document.querySelectorAll('.day-card').forEach(c => c.classList.remove('completed'));
  document.querySelectorAll('.activity-item').forEach(a => a.classList.remove('done'));
  collapseAll();
  updateProgress();
}

// ========== STATE ==========
function saveState() {
  const state = {};
  document.querySelectorAll('.day-card').forEach(card => {
    state[card.dataset.index] = card.classList.contains('completed');
  });
  localStorage.setItem('roadtrip-days', JSON.stringify(state));
}

function saveActivities() {
  const state = {};
  document.querySelectorAll('.day-card').forEach(card => {
    const items = [];
    card.querySelectorAll('.activity-item').forEach(a => {
      items.push(a.classList.contains('done'));
    });
    state[card.dataset.index] = items;
  });
  localStorage.setItem('roadtrip-activities', JSON.stringify(state));
}

function saveCustomData() {
  const data = {};
  document.querySelectorAll('.day-card').forEach(card => {
    const idx = card.dataset.index;
    const items = [];
    card.querySelectorAll('.activity-item').forEach(a => {
      const time = a.querySelector('.time')?.textContent?.trim() || '';
      const text = a.querySelector('.act-text')?.textContent?.trim() || '';
      items.push({time, text});
    });
    data[idx] = items;
  });
  localStorage.setItem('roadtrip-custom', JSON.stringify(data));
}

function getCustomData() {
  try { return JSON.parse(localStorage.getItem('roadtrip-custom') || '{}'); }
  catch(e) { return {}; }
}

function getActivitiesForDay(dayIdx, override) {
  if (override) return override;
  const custom = getCustomData();
  if (custom[dayIdx]) return custom[dayIdx];
  return DATA[dayIdx].activities;
}

function restoreState() {
  const days = JSON.parse(localStorage.getItem('roadtrip-days') || '{}');
  const acts = JSON.parse(localStorage.getItem('roadtrip-activities') || '{}');
  Object.entries(days).forEach(([idx, val]) => {
    const card = document.querySelector(`.day-card[data-index="${idx}"]`);
    if (card && val) card.classList.add('completed');
  });
  Object.entries(acts).forEach(([idx, items]) => {
    const card = document.querySelector(`.day-card[data-index="${idx}"]`);
    if (!card) return;
    card.querySelectorAll('.activity-item').forEach((a, i) => {
      if (items[i]) a.classList.add('done');
    });
  });
  updateProgress();
}

function updateProgress() {
  const total = DATA.length;
  const done = document.querySelectorAll('.day-card.completed').length;
  document.getElementById('done-count').textContent = done;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('pct-text').textContent = pct + '%';
}

// ========== EDIT MODE ==========
function toggleEditMode(btn) {
  const card = btn.closest('.day-card');
  card.classList.toggle('editing');
}

function startEdit(el, field, dayIdx, actIdx) {
  const card = el.closest('.day-card');
  if (!card.classList.contains('editing')) return;
  
  const current = el.textContent.trim();
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'edit-inline';
  input.value = current;
  input.dataset.field = field;
  input.dataset.day = dayIdx;
  input.dataset.act = actIdx;
  
  el.textContent = '';
  el.appendChild(input);
  input.focus();
  input.select();
  
  input.addEventListener('blur', function() { finishEdit(this); });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
    if (e.key === 'Escape') { this.value = current; this.blur(); }
  });
}

function finishEdit(input) {
  const span = input.parentElement;
  const val = input.value.trim() || span.textContent;
  span.textContent = val;
  
  // Save custom data
  const dayIdx = parseInt(input.dataset.day);
  saveCustomData();
  
  // Show brief confirmation
  const card = input.closest('.day-card');
  const saved = document.createElement('span');
  saved.textContent = ' ✓';
  saved.style.cssText = 'color:var(--accent);font-size:.8rem;margin-left:4px;';
  span.appendChild(saved);
  setTimeout(() => { if (saved.parentElement) saved.remove(); }, 1000);
}

function deleteActivity(btn, dayIdx, actIdx) {
  const card = btn.closest('.day-card');
  if (!card.classList.contains('editing')) return;
  if (!confirm('Supprimer cette activité ?')) return;
  
  const item = btn.closest('.activity-item');
  item.style.transition = 'all .2s';
  item.style.opacity = '0';
  item.style.transform = 'translateX(-20px)';
  setTimeout(() => {
    item.remove();
    saveCustomData();
    // Re-index remaining activities
    card.querySelectorAll('.activity-item').forEach((el, i) => {
      el.dataset.ai = i;
      const timeEl = el.querySelector('.time');
      const textEl = el.querySelector('.act-text');
      // Update onclick handlers
      timeEl.onclick = function(e) { e.stopPropagation(); startEdit(this,'time',parseInt(card.dataset.index),i); };
      textEl.onclick = function(e) { e.stopPropagation(); startEdit(this,'text',parseInt(card.dataset.index),i); };
    });
    updateProgress();
  }, 200);
}

function addActivity(btn) {
  const card = btn.closest('.day-card');
  if (!card.classList.contains('editing')) return;
  
  const list = card.querySelector('.activity-list');
  const dayIdx = parseInt(card.dataset.index);
  
  // Count existing
  const count = list.querySelectorAll('.activity-item').length;
  
  const item = document.createElement('div');
  item.className = 'activity-item';
  item.dataset.ai = count;
  item.onclick = function() { toggleActivity(this); };
  item.style.cssText = 'opacity:0;transform:translateY(-10px);transition:all .3s;';
  
  item.innerHTML = `
    <div class="check-activity"></div>
    <span class="time" onclick="event.stopPropagation();startEdit(this,'time',${dayIdx},${count})">Nouveau</span>
    <span class="act-text" onclick="event.stopPropagation();startEdit(this,'text',${dayIdx},${count})">Nouvelle activité</span>
    <button class="del-act-btn" onclick="event.stopPropagation();deleteActivity(this,${dayIdx},${count})" title="Supprimer">✕</button>
  `;
  
  list.appendChild(item);
  requestAnimationFrame(() => {
    item.style.opacity = '1';
    item.style.transform = 'translateY(0)';
  });
  
  saveCustomData();
  
  // Auto-open editing on the time field
  setTimeout(() => {
    const timeEl = item.querySelector('.time');
    startEdit(timeEl, 'time', dayIdx, count);
  }, 350);
}

// ========== VIEW TOGGLE ==========
function setView(mode) {
  localStorage.setItem('roadtrip-view', mode);
  document.getElementById('view-family').classList.toggle('active', mode === 'family');
  document.getElementById('view-ronald').classList.toggle('active', mode === 'ronald');
  render();
}
function restoreView() {
  const view = localStorage.getItem('roadtrip-view') || 'ronald';
  const el = document.getElementById('view-' + view);
  if (el) el.classList.add('active');
}

// ========== INIT ==========
render();
restoreView();
</script>
